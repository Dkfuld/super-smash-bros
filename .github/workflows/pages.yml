# Deploys the serverless Draft Order Simulator to GitHub Pages.
# Pages is served from the gh-pages branch (auto-enabled by its first push);
# every push to main rebuilds and updates https://<owner>.github.io/<repo>/
name: Deploy simulator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build serverless simulator
        run: npm run build --workspace apps/client
        env:
          VITE_SOLO_ONLY: "1"
          DDD_BASE: /${{ github.event.repository.name }}/
      - name: Publish to gh-pages
        run: |
          cd apps/client/dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages:gh-pages
